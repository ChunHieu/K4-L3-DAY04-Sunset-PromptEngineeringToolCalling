tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_services
    description: "Tra cứu thông tin về các dịch vụ y tế của phòng khám."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa dịch vụ"}
        category: {type: string, enum: [all, general, dental, imaging, lab, specialist], default: "all", description: "Nhóm dịch vụ"}
      required: [query]

  - name: search_doctors
    description: "Tìm kiếm bác sĩ theo chuyên khoa."
    parameters:
      type: object
      properties:
        specialty: {type: string, enum: [all, cardiology, dentistry, pediatrics, dermatology, general], default: "all", description: "Chuyên khoa"}
      required: [specialty]

  - name: check_availability
    description: "Kiểm tra lịch rảnh của bác sĩ trong một ngày cụ thể."
    parameters:
      type: object
      properties:
        doctor_id: {type: string, description: "Mã bác sĩ"}
        date: {type: string, description: "Ngày khám (YYYY-MM-DD)"}
      required: [doctor_id, date]

  - name: book_appointment
    description: "Đặt lịch khám bệnh."
    parameters:
      type: object
      properties:
        patient_name: {type: string, description: "Tên bệnh nhân"}
        phone: {type: string, description: "Số điện thoại"}
        doctor_id: {type: string, description: "Mã bác sĩ"}
        date: {type: string, description: "Ngày khám (YYYY-MM-DD)"}
        time: {type: string, description: "Giờ khám (HH:MM)"}
        confirmed: {type: boolean, default: false, description: "Đã xác nhận với người dùng"}
      required: [patient_name, phone, doctor_id, date, time]

  - name: cancel_appointment
    description: "Hủy lịch khám bệnh."
    parameters:
      type: object
      properties:
        appointment_id: {type: string, description: "Mã lịch hẹn"}
        phone: {type: string, description: "Số điện thoại của người đặt"}
        confirmed: {type: boolean, default: false, description: "Đã xác nhận với người dùng"}
      required: [appointment_id, phone]

  - name: clinic_policy
    description: "Tra cứu chính sách phòng khám (bảo hiểm, hoàn tiền, nội quy)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, insurance, refund, rules], default: "all", description: "Nhóm chính sách"}
      required: [query]
